<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инвентаризация склада</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
  min-height: 100vh;
  padding: 30px 20px;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: #eaeaea;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  padding: 30px;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

h1 {
  font-size: 1.9em;
  color: #4fc3f7;
  text-align: center;
  margin-bottom: 6px;
}
.subtitle {
  text-align: center;
  color: #8a9bb8;
  font-size: 0.9em;
  margin-bottom: 26px;
}

/* ---- Панель управления ---- */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.search-group {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: 260px;
}
.search-group input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 0.95em;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.search-group input::placeholder { color: #556; }
.search-group input:focus {
  border-color: #4fc3f7;
  box-shadow: 0 0 0 3px rgba(79,195,247,0.15);
}

.btn {
  padding: 12px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 0.9em;
  font-weight: 600;
  background: linear-gradient(135deg, #4fc3f7, #2196f3);
  color: #fff;
  transition: transform 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.btn:hover   { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(33,150,243,0.35); }
.btn:active  { transform: translateY(0); }

.btn-warn {
  background: linear-gradient(135deg, #ffb74d, #f57c00);
}
.btn-warn:hover { box-shadow: 0 8px 20px rgba(245,124,0,0.35); }

.btn-success {
  background: linear-gradient(135deg, #81c784, #43a047);
}
.btn-success:hover { box-shadow: 0 8px 20px rgba(67,160,71,0.35); }

.btn-purple {
  background: linear-gradient(135deg, #ba68c8, #8e24aa);
}
.btn-purple:hover { box-shadow: 0 8px 20px rgba(142,36,170,0.35); }

.btn-ghost {
  background: rgba(255,255,255,0.08);
  color: #bcd;
  border: 1px solid rgba(255,255,255,0.15);
}
.btn-ghost:hover { background: rgba(255,255,255,0.15); box-shadow: none; }

/* ---- Блок вывода ---- */
#output {
  min-height: 120px;
  padding: 20px;
  border-radius: 14px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 0.95em;
  line-height: 1.7;
  overflow-x: auto;
}
#output h3 {
  color: #4fc3f7;
  margin: 0 0 12px;
  font-size: 1.15em;
}
#output .idle-msg {
  color: #667;
  text-align: center;
  padding: 30px 0;
  font-style: italic;
}
#output .error-msg {
  color: #ff9b91;
  text-align: center;
  padding: 20px 0;
}

/* ---- Таблица ---- */
#output table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 0.92em;
}
#output th,
#output td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
#output th {
  background: rgba(79,195,247,0.12);
  color: #4fc3f7;
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.8em;
  letter-spacing: 0.6px;
  border-bottom: 1px solid rgba(79,195,247,0.25);
}
#output tr:hover td { background: rgba(255,255,255,0.03); }

.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.82em;
  font-family: 'Courier New', monospace;
  background: rgba(255,255,255,0.08);
  color: #bcd;
}
.tag-tech      { background: rgba(79,195,247,0.2);  color: #4fc3f7; }
.tag-furniture { background: rgba(255,183,77,0.2);  color: #ffb74d; }
.tag-lighting  { background: rgba(186,104,200,0.2); color: #ba68c8; }

/* ---- Карточки статистики ---- */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.stat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px 16px;
}
.stat-label {
  font-size: 0.75em;
  color: #8a9bb8;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 4px;
}
.stat-value {
  font-size: 1.5em;
  font-weight: bold;
  color: #4fc3f7;
  font-family: 'Courier New', monospace;
}

/* ---- Прайс-лист ---- */
.price-list {
  list-style: none;
  padding: 0;
  margin-top: 8px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 8px;
}
.price-list li {
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border-left: 3px solid #4fc3f7;
  border-radius: 8px;
  font-size: 0.95em;
}
.price-list li .price {
  float: right;
  color: #4fc3f7;
  font-weight: bold;
  font-family: 'Courier New', monospace;
}

.badge-info {
  display: inline-block;
  background: rgba(79,195,247,0.15);
  color: #4fc3f7;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.82em;
  margin-top: 10px;
}

/* ---- Результаты заданий ---- */
.task-block {
  margin-top: 18px;
  padding: 14px 18px;
  background: rgba(255,255,255,0.03);
  border-left: 3px solid #ba68c8;
  border-radius: 10px;
}
.task-block h4 {
  color: #ba68c8;
  font-size: 0.95em;
  margin-bottom: 8px;
}
.task-block .code {
  font-family: 'Courier New', monospace;
  color: #c9d1e0;
  font-size: 0.9em;
  word-break: break-all;
}

.check-true  { color: #4caf50; font-weight: bold; }
.check-false { color: #f44336; font-weight: bold; }

@media (max-width: 600px) {
  h1 { font-size: 1.4em; }
  .container { padding: 18px; }
  #output table { font-size: 0.82em; }
  #output th, #output td { padding: 8px 8px; }
}
</style>
</head>
<body>

<div class="container">
  <h1>📦 Инвентаризация склада</h1>
  <p class="subtitle">Демонстрация методов forEach / map / filter / reduce / find</p>

  <!-- Панель управления -->
  <div class="controls">
    <button class="btn" id="showAllBtn">📋 Показать все товары</button>

    <div class="search-group">
      <input type="text" id="searchInput" placeholder="Название товара..." autocomplete="off">
      <button class="btn btn-success" id="findBtn">🔍 Найти</button>
    </div>

    <button class="btn btn-warn" id="premiumBtn">⭐ Премиум (&gt; 500 ₽)</button>
    <button class="btn btn-purple" id="priceListBtn">🏷️ Прайс-лист</button>
    <button class="btn" id="totalBtn">💰 Общая стоимость</button>
    <button class="btn btn-ghost" id="tasksBtn">🎓 Задания 1–3</button>
  </div>

  <!-- Блок вывода -->
  <div id="output">
    <div class="idle-msg">Нажмите любую кнопку, чтобы начать...</div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
