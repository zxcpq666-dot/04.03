<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПР 17: Инкапсуляция и замыкания</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        h1 {
            grid-column: 1 / -1;
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .value-display {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: #007bff;
        }
        .range-display {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button.warn { background-color: #f39c12; }
        button.warn:hover { background-color: #d68910; }
        button.danger { background-color: #e74c3c; }
        button.danger:hover { background-color: #c0392b; }
        button.success { background-color: #2ecc71; }
        button.success:hover { background-color: #27ae60; }
        
        .settings {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            align-items: center;
        }
        .settings input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .console-box {
            grid-column: 1 / -1;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            height: 200px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .console-box h3 { margin-top: 0; color: white; font-family: sans-serif;}
        .log-line { margin-bottom: 5px; font-size: 0.9em; }
        .log-info { color: #569cd6; }
        .log-warn { color: #dcdcaa; }
        .log-error { color: #f44747; }
    </style>
</head>
<body>

    <h1>Практическая работа 17: Инкапсуляция</h1>

    <div class="container">
        <!-- Блок 1: Базовый счетчик -->
        <div class="card">
            <h2>Базовый счетчик (из методички)</h2>
            <div class="value-display" id="baseValue">0</div>
            <div class="controls">
                <button onclick="testBase.increment()">+1</button>
                <button class="warn" onclick="testBase.decrement()">-1</button>
                <button class="danger" onclick="testBase.reset()">Сброс</button>
            </div>
            <div style="margin-top: 15px; text-align: center;">
                <button class="success" onclick="checkPrivateAccess()">Проверить доступ к count</button>
            </div>
        </div>

        <!-- Блок 2: Счетчик с диапазоном (Самостоятельное задание) -->
        <div class="card">
            <h2>Счетчик с диапазоном (Задание)</h2>
            
            <div class="settings">
                <label>Min: <input type="number" id="minInput" value="0"></label>
                <label>Max: <input type="number" id="maxInput" value="5"></label>
                <button class="success" onclick="createNewBounded()">Создать</button>
            </div>

            <div class="range-display" id="rangeDisplay">
                Диапазон: 0 - 5 (Текущее: 0)
            </div>
            <div class="value-display" id="boundedValue">0</div>
            
            <div class="controls">
                <button onclick="bounded.increment().updateUI()">+1</button>
                <button class="warn" onclick="bounded.decrement().updateUI()">-1</button>
                <button class="danger" onclick="bounded.reset().updateUI()">Сброс</button>
            </div>
        </div>

        <!-- Блок вывода логов -->
        <div class="console-box" id="console">
            <h3>Вывод программы (Console)</h3>
        </div>
    </div>

    <script>
        // ==========================================
        // ПЕРЕХВАТ КОНСОЛИ ДЛЯ ВЫВОДА НА СТРАНИЦУ
        // ==========================================
        const consoleBox = document.getElementById('console');
        
        function printToConsole(text, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-line log-${type}`;
            div.textContent = text;
            consoleBox.appendChild(div);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;

        console.log = function(...args) {
            originalLog.apply(console, args);
            printToConsole(args.join(' '), 'info');
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            printToConsole('⚠ ' + args.join(' '), 'warn');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            printToConsole('❌ ' + args.join(' '), 'error');
        };


        // ==========================================
        // 1. БАЗОВЫЙ СЧЕТЧИК (ИЗ МЕТОДИЧКИ)
        // ==========================================
        function createCounter() {
            let count = 0;

            function logChange(operation) {
                console.log(`[${new Date().toLocaleTimeString()}] ${operation}: ${count}`);
            }

            return {
                increment: function() {
                    count++;
                    logChange('INCREMENT');
                    updateBaseUI();
                    return this;
                },
                decrement: function() {
                    if (count > 0) {
                        count--;
                        logChange('DECREMENT');
                    } else {
                        console.warn('Нельзя уменьшить: счетчик уже 0');
                    }
                    updateBaseUI();
                    return this;
                },
                getValue: function() {
                    return count;
                },
                reset: function() {
                    count = 0;
                    logChange('RESET');
                    updateBaseUI();
                    return this;
                }
            };
        }

        const testBase = createCounter();
        const baseValueDiv = document.getElementById('baseValue');

        function updateBaseUI() {
            baseValueDiv.textContent = testBase.getValue();
        }

        function checkPrivateAccess() {
            console.log('Пытаемся получить доступ к testBase.count...');
            console.log('Результат:', testBase.count);
            if (testBase.count === undefined) {
                console.warn('Успех! Переменная count инкапсулирована (undefined).');
            }
        }


        // ==========================================
        // 2. СЧЕТЧИК С ДИАПАЗОНОМ (САМОСТОЯТЕЛЬНОЕ ЗАДАНИЕ)
        // ==========================================
        function createBoundedCounter(min, max) {
            if (min > max) {
                throw new Error(`Ошибка: min (${min}) не может быть больше max (${max})`);
            }

            let count = min;

            function logChange(operation) {
                console.log(`[${new Date().toLocaleTimeString()}] ${operation}: ${count} (Диапазон: ${min} - ${max})`);
            }

            return {
                increment: function() {
                    if (count < max) {
                        count++;
                        logChange('INCREMENT');
                    } else {
                        console.warn(`Достигнут максимум: ${max}`);
                    }
                    return this;
                },
                decrement: function() {
                    if (count > min) {
                        count--;
                        logChange('DECREMENT');
                    } else {
                        console.warn(`Достигнут минимум: ${min}`);
                    }
                    return this;
                },
                getValue: function() {
                    return count;
                },
                getRange: function() {
                    return { min: min, max: max, current: count };
                },
                reset: function() {
                    count = min;
                    logChange('RESET');
                    return this;
                },
                // Специальный метод для обновления интерфейса
                updateUI: function() {
                    const state = this.getRange();
                    document.getElementById('boundedValue').textContent = state.current;
                    document.getElementById('rangeDisplay').textContent = 
                        `Диапазон: ${state.min} - ${state.max} (Текущее: ${state.current})`;
                    return this;
                }
            };
        }

        // Инициализация счетчика с диапазоном по умолчанию
        let bounded = createBoundedCounter(0, 5).updateUI();

        function createNewBounded() {
            const min = parseInt(document.getElementById('minInput').value);
            const max = parseInt(document.getElementById('maxInput').value);

            try {
                bounded = createBoundedCounter(min, max);
                bounded.updateUI();
                console.log(`Создан новый счетчик с диапазоном [${min}, ${max}]`);
            } catch (error) {
                console.error(error.message);
                alert(error.message); // Показываем ошибку пользователю
            }
        }

        // Приветственное сообщение
        console.log('Система готова к работе. Попробуйте нажать кнопки.');
    </script>
</body>
</html>
