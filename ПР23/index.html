<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека книг — наследование и полиморфизм</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      background: #f0f2f5;
      color: #1a1a2e;
    }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }

    .stats {
      background: #e8edf9;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .book-card {
      background: #fff;
      border: 1px solid #e3e8ef;
      border-radius: 12px;
      padding: 16px 18px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .book-title {
      font-weight: 700;
      font-size: 1.15em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .book-meta { color: #555; font-size: 14px; margin: 3px 0; }
    .book-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }

    .available   { color: #2e7d32; font-weight: 600; }
    .unavailable { color: #c62828; font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-book  { background: #eef1f5; color: #555; }
    .badge-ebook { background: #e8f5e9; color: #2e7d32; }
    .badge-audio { background: #fff4e0; color: #b26a00; }
    .badge-edu   { background: #e8edf9; color: #0047ab; }

    button {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid #dde1e6;
      background: #f7f9fc;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover { background: #e8edf9; border-color: #0047ab; }

    .progress-bar {
      height: 6px;
      background: #e9eef5;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
      max-width: 320px;
    }
    .progress-fill {
      height: 100%;
      background: #0047ab;
      border-radius: 3px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <h1>Моя библиотека</h1>
  <p class="subtitle">Наследование, полиморфизм и самостоятельные задания. Подробный вывод — в консоли (F12).</p>

  <div class="stats" id="stats"></div>
  <div id="booksContainer"></div>

  <script src="app.js"></script>
</body>
</html>
