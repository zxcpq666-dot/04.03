<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ПР №2 — Функции и работа с массивами</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f5f7fa;
            color: #2c3e50;
        }
        h1 {
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 18px;
            margin-top: -10px;
        }
        .section {
            background: white;
            border-radius: 10px;
            padding: 20px 25px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .section h2 {
            color: #2980b9;
            margin-top: 0;
            font-size: 20px;
        }
        .task {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 12px 15px;
            margin: 12px 0;
            border-radius: 4px;
        }
        .task h4 {
            margin-top: 0;
            color: #2c3e50;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-size: 15px;
            transition: all 0.2s;
        }
        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .output {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            min-height: 60px;
            line-height: 1.6;
        }
        .output.success-text { color: #2ecc71; }
        .output.error-text { color: #e74c3c; }
        .output.highlight { color: #f1c40f; }
        .flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus {
            border-color: #3498db;
            outline: none;
        }
    </style>
</head>
<body>
    <h1>Практическая работа №2</h1>
    <p class="subtitle">Функции и работа с массивами</p>
    <div id="app"></div>
    <script src="pr02.js"></script>
</body>
</html>
