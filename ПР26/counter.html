<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>React Счетчик (через CDN)</title>
</head>
<body>
    <div id="root"></div>

    <!-- 1. Подключаем React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- 2. Подключаем Babel для компиляции JSX прямо в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Наш React-код. Обратите внимание на type="text/babel" -->
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [count, setCount] = useState(0);
            const [inputValue, setInputValue] = useState('');
            const [history, setHistory] = useState([]);
            const [step, setStep] = useState(1);

            const maxCount = 20;
            const progress = Math.min((Math.max(0, count) / maxCount) * 100, 100);
            const isMaxReached = count >= maxCount;

            // Функция обновления
            const updateCount = (newValue) => {
                const numericValue = Number(newValue) || 0;
                setCount(numericValue);
                setHistory((prev) => [...prev, numericValue]);
            };

            const increment = () => updateCount(count + step);
            const decrement = () => updateCount(count - step);
            const reset = () => updateCount(0);
            const multiplyByTwo = () => updateCount(count * 2);

            const handleInputChange = (e) => {
                const value = e.target.value;
                setInputValue(value);
                updateCount(value !== '' ? value : 0);
            };

            const changeStep = (delta) => {
                setStep((prev) => Math.max(1, prev + delta));
            };

            const btnStyle = (bg) => ({
                padding: '10px 15px', fontSize: '16px', backgroundColor: bg, color: 'white',
                border: 'none', borderRadius: '5px', cursor: 'pointer', margin: '5px'
            });

            return (
                <div style={{ textAlign: 'center', fontFamily: 'Arial', maxWidth: '600px', margin: '30px auto', padding: '20px', backgroundColor: '#f5f5f5', borderRadius: '10px' }}>
                    <h1>Счетчик кликов (React)</h1>
                    
                    <div style={{ fontSize: '60px', fontWeight: 'bold', color: count > 10 ? 'red' : 'black', margin: '20px 0' }}>
                        {count}
                    </div>

                    {/* Прогресс-бар */}
                    <div style={{ width: '100%', height: '20px', backgroundColor: '#ddd', borderRadius: '10px', marginBottom: '20px' }}>
                        <div style={{ width: `${progress}%`, height: '100%', backgroundColor: count > 15 ? '#f44336' : '#4CAF50', borderRadius: '10px', transition: '0.3s' }} />
                    </div>

                    {/* Поле ввода */}
                    <input type="number" value={inputValue} onChange={handleInputChange} placeholder="Введите число" style={{ padding: '8px', fontSize: '16px', marginBottom: '15px' }} />

                    {/* Кнопки */}
                    <div>
                        <button onClick={decrement} style={btnStyle('#2196F3')}>-{step}</button>
                        <button onClick={increment} disabled={isMaxReached} style={btnStyle(isMaxReached ? '#9e9e9e' : '#4CAF50')}>+{step}</button>
                        <button onClick={reset} style={btnStyle('#f44336')}>Сброс</button>
                        <button onClick={multiplyByTwo} style={btnStyle('#9C27B0')}>×2</button>
                    </div>

                    {/* Управление шагом */}
                    <div style={{ marginTop: '15px' }}>
                        <span>Текущий шаг: <b>{step}</b> </span>
                        <button onClick={() => changeStep(-1)}>Шаг -1</button>
                        <button onClick={() => changeStep(1)}>Шаг +1</button>
                    </div>

                    {/* Предупреждения */}
                    {count > 10 && <p style={{ color: 'red', fontWeight: 'bold' }}>⚠ Счетчик превысил 10!</p>}
                    {isMaxReached && <p style={{ color: 'green', fontWeight: 'bold' }}>🎉 Достигнут максимум (20)!</p>}

                    {/* История */}
                    {history.length > 0 && (
                        <div style={{ marginTop: '20px', textAlign: 'left', borderTop: '2px solid #ccc', paddingTop: '10px' }}>
                            <h3>История:</h3>
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px' }}>
                                {history.map((val, i) => <span key={i} style={{ background: '#ddd', padding: '2px 8px', borderRadius: '3px' }}>{val}</span>)}
                            </div>
                            <button onClick={() => setHistory([])} style={{ marginTop: '10px', padding: '5px' }}>Очистить историю</button>
                        </div>
                    )}
                </div>
            );
        }

        // Монтируем React-приложение
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
